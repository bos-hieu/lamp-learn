# English tutor: the lamp's own model becomes a conversation partner and
# tutor. Started by its tool, which the model calls when someone asks to
# practise English, or when a computer's turn opens a practice. No
# trigger, no [ask]: a person asked. Works alone; with English marks the
# lamp also nods or tilts on each line.
needs = ["voice", "light"]
kind = "installable"
version = "0.1.1"
tool = "practise_english"

[permissions]
speak = true
light = true

[[do]]
# A soft blue while the practice opens.
light = { colour = "blue", level = 3, for = "10s" }
say = "You are now their English conversation partner and tutor, at the level they named (B1 if none). Answer what they said, then ask one short question back. When a line has a mistake, say the better way once, briefly, then carry on: one mistake a line, never a lecture. Say nothing about a line that is right. A sentence or two, then wait. If you have mark_english, call it before each answer."
