# English Tutor: the lamp's own model becomes an English conversation partner and
# tutor (start, a happy move), nods for a good line (good), tilts before a
# correction (fix),
# and says only "Okay" when an English lesson is asked for (lesson), which
# lamp-learn's listening mode then runs. Each step's words are in english.md.
# No trigger, no [ask]: a person asked.
needs = ["voice", "light", "body"]
kind = "installable"
version = "0.2.1"
tool = "english_tutor"
knowledge = "english.md"

[permissions]
speak = true
light = true
body = true

[choice]
name = "step"
about = "start: practise English. good: their line was right. fix: a better way comes next. lesson: an English lesson is asked for."
one_of = ["start", "good", "fix", "lesson"]
default = "start"

[[do]]
body = { gesture = { start = ["happy"], good = ["acknowledge"], fix = ["curious"], lesson = ["nod"] } }
light = { colour = "blue", level = 3, for = "10s" }
say = "Follow the part for this step."
