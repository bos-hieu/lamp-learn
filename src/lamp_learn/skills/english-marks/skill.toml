# English marks: the tutor's verdict on each line, shown with the body.
# Called by the model during a practice, just before it answers.
needs = ["voice", "body"]
kind = "installable"
version = "0.1.1"
tool = "mark_english"

[permissions]
speak = true
body = true

[choice]
name = "verdict"
about = "good: their line was right and natural. fix: you are about to say a better way. Always give one."
one_of = ["good", "fix"]

[[do]]
body = { gesture = { good = ["acknowledge"], fix = ["curious"] } }
say = "Now answer: if the verdict was fix, say the better way once, briefly, then carry on the conversation with one short question."
